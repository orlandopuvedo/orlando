<!doctype html><html><head><title>Acme - Operations Specialist</title></head><body>
<div class="main-header-content"><h2>Operations Specialist</h2></div>
<form method="POST" action="https://jobs.lever.co/acme/0b1c2d3e-0000-4000-8000-123456789abc/apply" enctype="multipart/form-data" id="application-form">
<div class="section application-form"><h4>Submit your application</h4><ul>
<li class="application-question resume"><div class="application-label">Resume/CV<span class="required">✱</span></div>
<div class="application-field"><input type="file" name="resume" id="resume-upload-input" required></div></li>
<li class="application-question"><div class="application-label">Full name<span class="required">✱</span></div>
<div class="application-field"><input type="text" name="name" required></div></li>
<li class="application-question"><div class="application-label">Email<span class="required">✱</span></div>
<div class="application-field"><input type="email" name="email" required></div></li>
<li class="application-question"><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone"></div></li>
<li class="application-question"><div class="application-label">Current location</div><div class="application-field"><input type="text" name="location"></div></li>
<li class="application-question"><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></li>
</ul></div>
<div class="section application-form"><ul>
<li class="application-question custom-question"><div class="application-label">Will you now or in the future require visa sponsorship?<span class="required">✱</span></div>
<div class="application-field"><select name="cards[abc][field0]" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div></li>
<li class="application-question"><div class="application-label">Additional information</div>
<div class="application-field"><textarea name="comments" placeholder="Add a cover letter or anything else you want to share."></textarea></div></li>
</ul></div>
<button type="submit" class="template-btn-submit postings-btn">Submit application</button>
</form></body></html>
