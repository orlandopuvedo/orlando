<!doctype html><html><head><title>Apply — Acme</title><style>.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden}</style></head><body>
<h1>Sales Development Representative</h1>
<form action="confirmation.html" method="get">
<label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
<label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
<label for="email">Email *</label><input id="email" name="email" type="email" required>
<label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" style="display:none">
<label for="country">Country *</label><select id="country" name="country" required><option value="">Select...</option><option>United States of America</option><option>Colombia (CO)</option></select>
<fieldset><legend>Can you work US Eastern hours? *</legend>
<label><input type="radio" name="hours" value="y" required> Yes</label><label><input type="radio" name="hours" value="n"> No</label></fieldset>
<label><input type="checkbox" id="consent" name="consent" required> I agree to the privacy policy *</label>
<input type="text" name="trap" style="display:none" aria-label="Leave empty">
<button type="submit" id="go">Submit Application</button>
</form></body></html>
